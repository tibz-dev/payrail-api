spring:
  application:
    name: payrail-api
  datasource:
    url: jdbc:postgresql://localhost:5432/payrail
    username: payrail
    password: payrail
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

payrail:
  jwt:
    secret: change-me-local-dev-only-secret-value
    expiry-minutes: 60