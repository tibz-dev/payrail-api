spring:
  application:
    name: payrail-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payrail}
    username: ${DB_USERNAME:payrail}
    password: ${DB_PASSWORD:payrail}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

payrail:
  jwt:
    secret: ${JWT_SECRET:change-me-local-dev-only-secret-value}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}